---
deployment:
  tasks:
    - >-
      /opt/cpanel/ea-php84/root/usr/bin/php -d display_errors=0 -r 'try {
          require "/home/servernetcloud/servernet_app/vendor/autoload.php";
          $client = new GuzzleHttp\Client();
          $results = [];
          foreach ([
              "configured"=>"https://docs.cpanel.net/release-notes/release-notes/index.xml",
              "section"=>"https://docs.cpanel.net/release-notes/index.xml"
          ] as $label=>$url) {
              $row = ["probe"=>$label]; $phase = "fetch"; $stream = null;
              try {
                  $r=$client->get($url,["headers"=>["User-Agent"=>"ServerNet-Hermes-Knowledge/1.0",
                      "Accept"=>"application/atom+xml, application/rss+xml, application/xml, text/xml"],
                      "connect_timeout"=>5,"timeout"=>15,"allow_redirects"=>false,"http_errors"=>false,"stream"=>true]);
                  $row["http_status"]=$r->getStatusCode();
                  $row["content_type"]=$r->getHeaderLine("Content-Type");
                  $phase="read"; $stream=$r->getBody(); $body="";
                  while (!$stream->eof() && strlen($body)<=1048576) {
                      $chunk=$stream->read(min(65536,1048577-strlen($body)));
                      if ($chunk==="" && !$stream->eof()) {throw new RuntimeException("Incomplete bounded read");}
                      $body.=$chunk;
                  }
                  $row["body_bytes_read"]=strlen($body);
                  $row["over_limit"]=strlen($body)>1048576;
                  $row["has_doctype_or_entity"]=(bool)preg_match("/<!\\s*(?:DOCTYPE|ENTITY)/i",$body);
                  $phase="parse";
                  if ($r->getStatusCode()>=200 && $r->getStatusCode()<300) {
                      $items=App\Services\Hermes\HermesKnowledge::parse("cpanel",$body,time());
                      $row["parse_status"]="valid"; $row["accepted_items"]=count($items);
                  } else {$row["parse_status"]="not_parsed_non_2xx";}
              } catch (Throwable $e) {$row["failure_phase"]=$phase;$row["exception_class"]=$e::class;}
              finally {if ($stream) {$stream->close();}}
              $results[]=$row;
          }
          echo json_encode(["status"=>"bounded_official_feed_read","results"=>$results],JSON_THROW_ON_ERROR)."\n";
      } catch (Throwable $e) {echo json_encode(["status"=>"feed_read_unavailable","exception_class"=>$e::class])."\n";exit(1);}'
