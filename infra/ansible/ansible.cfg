# ServerNet IaC — Ansible configuration
# Safe-by-default settings for a LIVE single-node Proxmox platform.
[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = ./collections:~/.ansible/collections
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 5
# Never let a typo blast the whole fleet. Playbooks are additive; prove with --check first.
any_errors_fatal     = True
display_skipped_hosts = False

[inventory]
enable_plugins = yaml, ini

[privilege_escalation]
become        = False
become_method = sudo

[ssh_connection]
pipelining = True
# Keep control sockets short-lived; this is infrastructure, not a shell farm.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
