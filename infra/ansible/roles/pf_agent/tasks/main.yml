---
# Port-forward agent on the Proxmox host. Stage-by-default; pf_apply=true to
# install + enable the timer.
- name: Ensure host staging dir
  ansible.builtin.file:
    path: "{{ pf_stage_dir }}"
    state: directory
    mode: "0700"

- name: Render agent script + units to staging
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ pf_stage_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: servernet-pf-agent.sh.j2,      dest: servernet-pf-agent.sh,      mode: "0750" }
    - { src: servernet-pf-agent.service.j2, dest: servernet-pf-agent.service, mode: "0644" }
    - { src: servernet-pf-agent.timer.j2,   dest: servernet-pf-agent.timer,   mode: "0644" }
    - { src: pf-agent.env.j2,               dest: pf-agent.env,               mode: "0640" }
  no_log: true                      # script carries the agent token

- name: Stage-only notice
  ansible.builtin.debug:
    msg:
      - "pf-agent staged at {{ pf_stage_dir }}. It uses only the {{ pf_chain }} nat chain (additive)."
      - "Nothing installed (pf_apply=false). Re-run with -e pf_apply=true to enable the 1-min timer."
  when: not (pf_apply | bool)

- name: Apply pf-agent to host
  when: pf_apply | bool
  block:
    - name: Ensure /etc/servernet exists
      ansible.builtin.file:
        path: /etc/servernet
        state: directory
        mode: "0750"

    # هر دو عامل (port-forward و country) آدرس/توکن را از این فایل می‌خوانند.
    # مالکیتش دستِ IaC است تا دیگر کهنه و بی‌صدا نمانَد.
    - name: Install shared agent env
      ansible.builtin.copy:
        src: "{{ pf_stage_dir }}/pf-agent.env"
        dest: /etc/servernet/pf-agent.env
        mode: "0640"
        remote_src: true

    - name: Install agent script
      ansible.builtin.copy:
        src: "{{ pf_stage_dir }}/servernet-pf-agent.sh"
        dest: /usr/local/bin/servernet-pf-agent.sh
        mode: "0750"
        remote_src: true

    - name: Install systemd unit + timer
      ansible.builtin.copy:
        src: "{{ pf_stage_dir }}/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        remote_src: true
      loop:
        - servernet-pf-agent.service
        - servernet-pf-agent.timer

    - name: Enable + start the timer
      ansible.builtin.systemd:
        name: servernet-pf-agent.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Run one reconcile now
      ansible.builtin.command: systemctl start servernet-pf-agent.service
      changed_when: true

    - name: Show current forward chain
      ansible.builtin.command: iptables -t nat -L {{ pf_chain }} -n
      register: _chain
      changed_when: false

    - name: pf-agent summary
      ansible.builtin.debug:
        var: _chain.stdout_lines
