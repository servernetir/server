---
# Module 2b / step 4 — mihomo egress KILL-SWITCH for LXC {{ ks_ctid }}.
# Stage-by-default; killswitch_apply=true installs + enables the persisted rule.
# Depends on mihomo being present (run AFTER exit_multicountry).
#
# ROLLBACK (manual):
#   pct exec {{ ks_ctid }} -- systemctl disable --now servernet-killswitch
#   # ExecStop removes the iptables DROP rule; disabling stops it re-adding at boot.

- name: Ensure host staging dir
  ansible.builtin.file:
    path: "{{ killswitch_stage_dir }}"
    state: directory
    mode: "0700"

- name: Render kill-switch unit to staging
  ansible.builtin.template:
    src: servernet-killswitch.service.j2
    dest: "{{ killswitch_stage_dir }}/servernet-killswitch.service"
    mode: "0644"

- name: Stage-only notice
  ansible.builtin.debug:
    msg:
      - "mihomo_killswitch staged at {{ killswitch_stage_dir }}."
      - "On apply it restricts the mihomo cgroup to loopback-only egress => empty countries are CUT, never leak the Iran IP."
      - "Nothing pushed to container {{ ks_ctid }} (killswitch_apply=false)."
  when: not (killswitch_apply | bool)

- name: Apply mihomo_killswitch to container
  when: killswitch_apply | bool
  block:
    - name: Confirm container {{ ks_ctid }} exists
      ansible.builtin.command: pct status {{ ks_ctid }}
      register: _ksstat
      changed_when: false

    - name: Resolve mihomo.service cgroup (fatal if missing)
      ansible.builtin.command: >-
        pct exec {{ ks_ctid }} -- systemctl show -p ControlGroup --value mihomo.service
      register: _ks_cg
      changed_when: false
      failed_when: (_ks_cg.stdout | default('') | trim | length) == 0

    - name: Push kill-switch unit into container
      ansible.builtin.command: >-
        pct push {{ ks_ctid }} {{ killswitch_stage_dir }}/servernet-killswitch.service /etc/systemd/system/servernet-killswitch.service
      changed_when: true

    - name: Enable + start the persisted kill-switch (inserts the rule idempotently)
      ansible.builtin.command: >-
        pct exec {{ ks_ctid }} -- bash -lc
        'systemctl daemon-reload && systemctl enable --now servernet-killswitch'
      changed_when: true

    - name: Verify the loopback-only DROP rule is present
      ansible.builtin.command: >-
        pct exec {{ ks_ctid }} -- bash -lc
        'CGP=$(systemctl show -p ControlGroup --value mihomo.service | sed s:^/::);
         iptables -C OUTPUT -m cgroup --path "$CGP" ! -o lo -j DROP'
      register: _ks_rule
      changed_when: false

    - name: mihomo_killswitch verify note
      ansible.builtin.debug:
        msg:
          - "Kill-switch ACTIVE in LXC {{ ks_ctid }} (mihomo cgroup: loopback-only egress)."
          - "VERIFY manually: a country WITH nodes must still exit that country, a country WITHOUT live nodes must be EMPTY — never loc=IR:"
          - "  pct exec {{ ks_ctid }} -- curl -s --socks5-hostname 127.0.0.1:{{ ks_verify_de_port }} https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc)='   # expect loc=DE"
          - "  pct exec {{ ks_ctid }} -- curl -s --socks5-hostname 127.0.0.1:{{ ks_verify_uk_port }} https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc)='   # expect EMPTY (cut)"
          - "Rollback: pct exec {{ ks_ctid }} -- systemctl disable --now servernet-killswitch"
