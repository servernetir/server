[DEFAULT]
# ServerNet Windows — Cloudbase-Init config AFTER the access fix.
# The two plugins that failed on boot-1 (NERR_NotPrimary 2226) are REMOVED:
#   * cloudbaseinit.plugins.windows.createuser.CreateUserPlugin
#   * cloudbaseinit.plugins.windows.setuserpassword.SetUserPasswordPlugin
# The Administrator password is now handled entirely by SetupComplete.cmd +
# sn-firstboot.ps1. Cloudbase-Init only does network + hostname here.
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
config_drive_types=vfat,iso
config_drive_locations=cdrom,hdd
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService,cloudbaseinit.metadata.services.configdrive.ConfigDriveService

plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
allow_reboot=false
stop_service_on_exit=false
