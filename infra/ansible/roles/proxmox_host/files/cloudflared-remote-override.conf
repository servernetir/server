[Unit]
Wants=servernet-cloudflared-egress.service
After=servernet-cloudflared-egress.service

[Service]
Environment="TUNNEL_TRANSPORT_PROTOCOL=http2"
ExecStart=
ExecStart=/usr/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yml tunnel run --token-file /etc/cloudflared/pve-tunnel.token
