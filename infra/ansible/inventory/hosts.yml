---
# ServerNet inventory.
#
# DESIGN: every task that touches the live platform runs against the single
# Proxmox host (group `proxmox`). Work inside the LXC containers (115 control,
# 113 exit) is performed via `pct exec` / `pct push` FROM the host — the exact,
# proven manual workflow, so no container needs a new SSH surface and the whole
# blast radius stays on one well-understood connection.
#
# The `exit_servers` group is separate: those are EXTERNAL raw servers (Phase 3,
# e.g. Hetzner) reached over direct SSH and hardened with devsec.hardening.
#
# NEVER run with `--limit all` against destructive plays. Templates and the
# pre-existing guests (100-114, incl. the VM108 red line) are protected in
# group_vars/all.yml and by the destroy guard — but scope every run anyway.

all:
  children:
    proxmox:
      hosts:
        pve-node:
          # SSH endpoint of the Proxmox host. Set to the IP/host you already
          # use for `ssh root@...` admin. Public anchor shown as a default;
          # prefer the private mgmt IP if the controller can reach it.
          ansible_host: 85.9.108.118
          ansible_user: root
          ansible_connection: ssh

    # External exit servers (Phase 3). Empty until you add raw servers.
    # Example member:
    #   exit-de-1:
    #     ansible_host: 203.0.113.10
    #     ansible_user: root          # first boot only; hardening creates svcops
    exit_servers:
      hosts: {}
