# Include inside the existing FusionPBX server block, after reviewing its PHP handler.
# FusionPBX 5.6 may use /var/www/fusionpbx/public as the server-level document root.
# This mounts only this dedicated app's files from the parent FusionPBX tree.
# IMPORTANT: the existing PHP regex location MUST execute /app/servernet_voice/*.php
# through PHP-FPM using /var/www/fusionpbx as its script root. This prefix alone is
# NOT a PHP handler. Do not use ^~ here: it would suppress that regex and may expose
# PHP source as a static file. Do not install if PHP execution cannot be verified.
location /app/servernet_voice/ {
    root /var/www/fusionpbx;
    try_files $uri =404;
}

# Optional friendly entry point. The trailing slash preserves relative asset/API URLs.
location = /phone {
    return 302 /phone/;
}
location = /phone/ {
    rewrite ^ /app/servernet_voice/index.php last;
}
location /phone/ {
    rewrite ^/phone/(.*)$ /app/servernet_voice/$1 last;
}
