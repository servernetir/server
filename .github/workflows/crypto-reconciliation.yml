name: Crypto reconciliation regression checks

on:
  pull_request:
    branches: [develop]
    paths:
      - 'website/app/Services/Payment/**'
      - 'website/app/Models/Crypto*.php'
      - 'website/database/migrations/*payment*'
      - 'website/tests/Feature/Crypto*.php'
      - 'website/tests/compare-crypto-baseline.py'
      - '.github/workflows/crypto-reconciliation.yml'
  push:
    branches: [develop, 'fix/crypto-reconciliation-*']
    paths:
      - 'website/app/Services/Payment/**'
      - 'website/app/Models/Crypto*.php'
      - 'website/database/migrations/*payment*'
      - 'website/tests/Feature/Crypto*.php'
      - 'website/tests/compare-crypto-baseline.py'
      - '.github/workflows/crypto-reconciliation.yml'

permissions:
  contents: read

concurrency:
  group: crypto-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Crypto settlement (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-test-only
          MARIADB_DATABASE: crypto_reconciliation_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: website
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: http://localhost
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'crypto_reconciliation_testing' }}
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SMS_DRIVER: log
      PAGE_CACHE: 'false'
      EXCHANGE_ENABLED: 'false'
      CRYPTO_EXPECTED_DB: ${{ matrix.database }}
      COMPOSER_MAX_PARALLEL_HTTP: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies without project install scripts
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e bootstrap/cache/config.php
          for attempt in 1 2 3; do
            composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins && break
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
          composer check-platform-reqs
          php artisan package:discover --ansi
      - name: Lint repair files
        run: |
          set -euo pipefail
          php -l app/Services/Payment/CryptoReconciler.php
          php -l app/Models/CryptoPayment.php
          php -l database/migrations/2026_11_04_000100_widen_payment_reference_for_crypto.php
          php -l tests/Feature/CryptoReconciliationResilienceTest.php
      - name: Exercise settlement, replay, migration and failure isolation
        run: |
          vendor/bin/phpunit --colors=never --filter='CryptoReconciliationResilienceTest|CryptoBep20Test|CryptoTronPaymentTest|CryptoStaleDepositTest'
      - name: Check out the exact PR base for honest legacy failure comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Compare broad regressions with the unchanged baseline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp -a vendor ../baseline/website/vendor
          (cd ../baseline/website && composer dump-autoload --no-scripts --no-plugins --no-interaction >/dev/null)
          legacy='CryptoBep20Test|CryptoTronPaymentTest|CryptoStaleDepositTest|CryptoAvailabilityAndMatchingTest|PaymentCallbackTest|CreditInvoicePaymentTest'
          before=0
          after=0
          (cd ../baseline/website && vendor/bin/phpunit --colors=never --filter="$legacy" --log-junit "$RUNNER_TEMP/crypto-before.xml") > "$RUNNER_TEMP/crypto-before.log" 2>&1 || before=$?
          vendor/bin/phpunit --colors=never --filter="$legacy" --log-junit "$RUNNER_TEMP/crypto-after.xml" > "$RUNNER_TEMP/crypto-after.log" 2>&1 || after=$?
          tail -n 4 "$RUNNER_TEMP/crypto-before.log"
          tail -n 4 "$RUNNER_TEMP/crypto-after.log"
          python3 tests/compare-crypto-baseline.py "$RUNNER_TEMP/crypto-before.xml" "$RUNNER_TEMP/crypto-after.xml" "$before" "$after"
