name: Panel navigation checks

on:
  pull_request:
    branches: [develop]
    paths:
      - 'website/resources/views/panel/layout.blade.php'
      - 'website/public/assets/css/panel.css'
      - 'website/public/assets/js/panel-navigation.js'
      - 'website/tests/js/panel-navigation.browser.cjs'
      - '.github/workflows/panel-navigation.yml'
  push:
    branches: [develop]
    paths:
      - 'website/resources/views/panel/layout.blade.php'
      - 'website/public/assets/css/panel.css'
      - 'website/public/assets/js/panel-navigation.js'
      - 'website/tests/js/panel-navigation.browser.cjs'
      - '.github/workflows/panel-navigation.yml'

permissions:
  contents: read

concurrency:
  group: panel-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout event revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check website/public/assets/js/panel-navigation.js
      - name: Verify customer drawer in isolated Chromium fixtures
        env:
          TEST_CHROME: /usr/bin/google-chrome
        run: |
          node --version
          "$TEST_CHROME" --version
          node --test website/tests/js/panel-navigation.browser.cjs
