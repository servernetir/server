name: Commercial SEO growth checks

on:
  push:
    branches: [develop]
    paths:
      - 'website/app/Services/PublicPageStyles.php'
      - 'website/app/Services/Cloud/CountryLandingSeo.php'
      - 'website/app/Services/InternalLinks.php'
      - 'website/app/Http/Middleware/PageCache.php'
      - 'website/app/Http/Controllers/SiteController.php'
      - 'website/config/pagecache.php'
      - 'website/config/hosting.php'
      - 'website/config/catalog/vps.php'
      - 'website/resources/views/pages/*.blade.php'
      - 'website/resources/views/partials/*.blade.php'
      - 'website/lang/**/hosting-seo.php'
      - 'website/lang/**/country-seo.php'
      - 'website/lang/**/vps-guide.php'
      - 'website/lang/**/tool-next-step.php'
      - 'website/public/assets/css/tool-next-step.css'
      - 'website/tests/Feature/*PageCache*'
      - 'website/tests/Feature/*OrderSummary*'
      - 'website/tests/Feature/*InternalLinkCommercial*'
      - 'website/tests/Feature/*ToolProductCta*'
      - 'website/tests/js/tool-next-step.test.cjs'
      - 'website/tests/Feature/CommercialSeoGrowthTest.php'
      - 'website/tests/Feature/SitemapIndexTest.php'
      - 'website/tests/Feature/Audit7RegressionTest.php'
      - 'scripts/seo-growth-cycle/opportunities.py'
      - 'scripts/seo-growth-cycle/test_opportunities.py'
      - '.github/workflows/seo-commercial-growth.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'website/app/Services/PublicPageStyles.php'
      - 'website/app/Services/Cloud/CountryLandingSeo.php'
      - 'website/app/Services/InternalLinks.php'
      - 'website/app/Http/Middleware/PageCache.php'
      - 'website/app/Http/Controllers/SiteController.php'
      - 'website/config/pagecache.php'
      - 'website/config/hosting.php'
      - 'website/config/catalog/vps.php'
      - 'website/resources/views/pages/*.blade.php'
      - 'website/resources/views/partials/*.blade.php'
      - 'website/lang/**/hosting-seo.php'
      - 'website/lang/**/country-seo.php'
      - 'website/lang/**/vps-guide.php'
      - 'website/lang/**/tool-next-step.php'
      - 'website/public/assets/css/tool-next-step.css'
      - 'website/tests/Feature/*PageCache*'
      - 'website/tests/Feature/*OrderSummary*'
      - 'website/tests/Feature/*InternalLinkCommercial*'
      - 'website/tests/Feature/*ToolProductCta*'
      - 'website/tests/js/tool-next-step.test.cjs'
      - 'website/tests/Feature/CommercialSeoGrowthTest.php'
      - 'website/tests/Feature/SitemapIndexTest.php'
      - 'website/tests/Feature/Audit7RegressionTest.php'
      - 'scripts/seo-growth-cycle/*opportunities.py'
      - '.github/workflows/seo-commercial-growth.yml'

permissions:
  contents: read

concurrency:
  group: seo-commercial-growth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: 'http://localhost'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      PAGE_CACHE: 'false'
      EXCHANGE_ENABLED: 'false'
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Verify offline opportunity analysis
        run: python3 -m unittest discover -s scripts/seo-growth-cycle -p test_opportunities.py -v
      - name: Install locked dependencies in isolated checkout
        working-directory: website
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e bootstrap/cache/config.php
          php -v
          git rev-parse HEAD
          composer install --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
          php artisan package:discover --ansi
      - name: Lint and exercise commercial pages without provider requests
        working-directory: website
        run: |
          set -euo pipefail
          php -l app/Services/PublicPageStyles.php
          php -l app/Services/Cloud/CountryLandingSeo.php
          php -l app/Services/InternalLinks.php
          php -l app/Http/Middleware/PageCache.php
          php -l app/Http/Controllers/SiteController.php
          php -l config/pagecache.php
          php -l config/hosting.php
          php -l config/catalog/vps.php
          php -l tests/Feature/CommercialSeoGrowthTest.php
          php -l tests/Feature/SitemapIndexTest.php
          php -l tests/Feature/Audit7RegressionTest.php
          find lang -name hosting-seo.php -print0 | xargs -0 -n1 php -l
          vendor/bin/phpunit tests/Feature/CommercialSeoGrowthTest.php tests/Feature/HourlyVpsPageTest.php tests/Feature/GpuPageTest.php tests/Feature/CountryLandingSeoTest.php tests/Feature/CountryVpsServiceSchemaTest.php tests/Feature/PublicPageStylesTest.php tests/Feature/SeoMetadataAndEntityTest.php tests/Feature/AnalyticsDataLayerCatalogTest.php tests/Feature/AnalyticsSessionEventConsumptionTest.php tests/Feature/PageCacheTest.php tests/Feature/OrderSummaryIndexingTest.php tests/Feature/InternalLinkCommercialTargetsTest.php tests/Feature/ToolProductCtaTest.php tests/Feature/SitemapIndexTest.php --display-warnings --fail-on-warning --colors=never
      - name: Verify tool conversion click contract
        run: node website/tests/js/tool-next-step.test.cjs
      - name: Verify order handoff remains excluded from sitemap discovery
        working-directory: website
        run: vendor/bin/phpunit tests/Feature/Audit7RegressionTest.php --filter test_order_summary_is_noindex_and_excluded_from_the_sitemap --display-warnings --fail-on-warning --colors=never
