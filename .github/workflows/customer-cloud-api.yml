name: Customer cloud API contract
on:
  pull_request:
    branches: [develop]
    paths:
      - 'website/app/Services/CustomerApi/**'
      - 'website/app/Services/Cloud/CloudPower.php'
      - 'website/app/Services/Cloud/HourlyGpuStart.php'
      - 'website/app/Services/Cloud/InterruptibleBillingClock.php'
      - 'website/app/Http/Controllers/Api/**'
      - 'website/app/Http/Controllers/CustomerApiDocsController.php'
      - 'website/app/Http/Controllers/Account/**'
      - 'website/app/Models/CustomerApiToken.php'
      - 'website/app/Http/Middleware/CustomerApiResponse.php'
      - 'website/routes/**'
      - 'website/database/migrations/*customer_api_operations*'
      - 'website/resources/views/account/**'
      - 'website/resources/views/pages/developers-platform.blade.php'
      - 'website/lang/*/customer-api.php'
      - 'website/tests/Feature/CustomerCloudApi*'
      - 'website/tests/Feature/HourlyRuntimeCreditTest.php'
      - '.github/workflows/customer-cloud-api.yml'
permissions:
  contents: read
concurrency:
  group: customer-cloud-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-test-only
          MARIADB_DATABASE: customer_api_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'customer_api_testing' }}
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Install exact dependencies in isolated checkout
        run: |
          test ! -e .env
          test ! -e bootstrap/cache/config.php
          composer install --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
          php artisan package:discover --ansi
      - name: Test security, billing, migration and all three documentation locales
        run: |
          python3 <<'PY'
          import os, xml.etree.ElementTree as ET
          tree = ET.parse('phpunit.xml')
          for key in ['DB_CONNECTION', 'DB_HOST', 'DB_PORT', 'DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD']:
              node = tree.find('./php/env[@name="'+key+'"]')
              if node is None: node = ET.SubElement(tree.find('php'), 'env', name=key)
              node.set('value', os.environ[key]); node.set('force', 'true')
          tree.write('.customer-api-ci.xml', encoding='unicode')
          PY
          php vendor/bin/phpunit -c .customer-api-ci.xml --filter='CustomerCloudApiTest|CustomerCloudApiMigrationTest|HourlyRuntimeCreditTest|CloudFairHourlyMeteringTest|CloudPoweredOffStillBilledTest' --fail-on-warning
