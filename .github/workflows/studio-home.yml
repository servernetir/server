name: Studio homepage presentation
on:
  pull_request:
    branches: [develop]
    paths: ['website/resources/views/pages/home.blade.php', 'website/resources/views/pages/hosting.blade.php', 'website/resources/views/pages/transactional-email.blade.php', 'website/resources/views/partials/home-email-slide.blade.php', 'website/resources/views/partials/email-product-choice.blade.php', 'website/resources/views/partials/transactional-email-visual.blade.php', 'website/public/assets/css/email-showcase.css', 'website/lang/*/transactional-email.php', 'website/tests/Feature/TransactionalEmailTest.php', 'website/tests/js/transactional-email.test.cjs', 'scripts/home-email-studio-20261123/**', 'website/resources/views/partials/home-gpu-slide.blade.php', 'website/public/assets/css/home-gpu-slide.css', 'website/app/Http/Middleware/CloudStoreBrowse.php', 'website/app/Http/Controllers/Account/CloudStoreGuestController.php', 'website/app/Services/Cloud/CloudStoreDraft.php', 'website/app/Services/Cloud/CloudImageRegionLookup.php', 'scripts/cloud-store-catalog-performance-20261123/**', 'website/tests/Feature/PublicCloudStoreTest.php', 'scripts/home-vps-gpu-public-store-20261123/**', 'website/resources/views/partials/studio-carousel*.blade.php', 'website/public/assets/*/studio-*', 'website/public/assets/js/atlas*', 'website/scripts/build-atlas-land-points.py', 'scripts/home-glass-fine-globe-20261123/**', 'website/lang/*/studio_carousel.php', 'website/lang/*/home_slides.php', 'website/resources/views/partials/home-service-slides.blade.php', 'website/tests/Fixtures/StudioHomePreview.php', 'website/tests/js/studio-home.test.cjs', 'website/tests/Feature/StudioHomeHeroTest.php', 'scripts/studio-carousel-20261122/**', 'scripts/home-four-slides-20261123/**', 'website/resources/views/partials/home-parts-slide.blade.php', 'website/public/assets/css/home-parts-slide.css', 'website/public/assets/img/home-parts-*', 'scripts/home-hardware-hero-20261123/**', '.github/workflows/studio-home.yml']
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sodium, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked test dependencies
        working-directory: website
        run: |
          test ! -e .env
          test ! -e bootstrap/cache/config.php
          composer install --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
          npm ci --prefix tests/js --ignore-scripts
      - name: Check actual homepage rendering and local preview interactions
        working-directory: website
        run: |
          set -euo pipefail
          php -l tests/Fixtures/StudioHomePreview.php
          for locale in fa en tr; do php -l "lang/$locale/studio_carousel.php"; php -l "lang/$locale/home_slides.php"; done
          php artisan test tests/Feature/StudioHomeHeroTest.php tests/Feature/StudioDownloadsTest.php tests/Feature/HomePricingPresentationTest.php tests/Feature/AtlasPublicPagesTest.php tests/Feature/PublicCloudStoreTest.php tests/Feature/TransactionalEmailTest.php tests/Feature/HomeDiscoveryTest.php tests/Feature/RobotsPolicyTest.php tests/Feature/LlmsTxtIsCompleteTest.php tests/Feature/SitemapIndexTest.php
          node --check public/assets/js/studio-carousel.js
          node --check public/assets/js/atlas.js
          node --check public/assets/js/atlas.min.js
          node --check public/assets/js/atlas-home-globe.js
          for locale in fa en tr; do php tests/Fixtures/StudioHomePreview.php "$locale" /tmp/studio-home-preview; done
          STUDIO_HOME_FIXTURES=/tmp/studio-home-preview node --test tests/js/studio-home.test.cjs
          node --test tests/js/home-globe-performance.test.cjs
          node --test tests/js/transactional-email.test.cjs
      - name: Check limited release preservation and rollback guards
        run: |
          php -l scripts/studio-carousel-20261122/activate.php
          python3 scripts/studio-carousel-20261122/test_release.py
          php -l scripts/home-four-slides-20261123/activate.php
          python3 scripts/home-four-slides-20261123/test_release.py
          php -l scripts/home-glass-fine-globe-20261123/activate.php
          python3 scripts/home-glass-fine-globe-20261123/test_release.py
          php -l scripts/home-vps-gpu-public-store-20261123/activate.php
          python3 scripts/home-vps-gpu-public-store-20261123/test_release.py
          php -l scripts/cloud-store-catalog-performance-20261123/activate.php
          python3 scripts/cloud-store-catalog-performance-20261123/test_release.py
          php -l scripts/home-email-studio-20261123/activate.php
          python3 scripts/home-email-studio-20261123/test_release.py
          php -l scripts/home-discovery-20261123/activate.php
          python3 scripts/home-discovery-20261123/test_release.py
          php -l scripts/home-hardware-hero-20261123/activate.php
          python3 scripts/home-hardware-hero-20261123/test_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-home-preview
          path: /tmp/studio-home-preview
          retention-days: 7
