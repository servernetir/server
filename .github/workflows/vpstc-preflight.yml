name: VPS.TC read-only preflight tests

on:
  push:
    branches: [codex/vpstc-readonly-preflight]
  pull_request:
    branches: [develop]
    paths:
      - 'website/app/**/VpsTc*.php'
      - 'website/tests/Feature/VpsTc*.php'
      - 'website/resources/views/admin/cloud*.blade.php'
      - 'website/routes/web.php'
      - 'website/config/services.php'
      - '.github/workflows/vpstc-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      EXCHANGE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sodium, zip
          tools: composer:v2
          coverage: none
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run mocked protocol and isolated admin acceptance
        run: php vendor/bin/phpunit tests/Feature/VpsTcApiTest.php tests/Feature/VpsTcPreflightTest.php tests/Feature/VpsTcAdminTest.php
