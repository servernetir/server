name: SEO Git guide checks

on:
  push:
    branches: ['seo/20261026-git-deployment-guide']
    paths:
      - 'website/resources/content/growth/git-basics-for-deployment.json'
      - 'website/tests/Feature/GitDeploymentArticleReviewTest.php'
      - 'scripts/seo-growth-cycle/test_git_deployment_article.py'
      - '.github/workflows/seo-git-guide-check.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'website/resources/content/growth/git-basics-for-deployment.json'
      - 'website/tests/Feature/GitDeploymentArticleReviewTest.php'
      - 'scripts/seo-growth-cycle/test_git_deployment_article.py'
      - '.github/workflows/seo-git-guide-check.yml'

permissions:
  contents: read

concurrency:
  group: seo-git-guide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  article-checks:
    if: github.repository == 'servernetir/server' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: 'http://localhost'
      APP_LOCALE: fa
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      PAGE_CACHE: 'false'
      EXCHANGE_ENABLED: 'false'
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Checkout exact event revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up isolated PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sodium, zip
          coverage: none
          tools: composer:v2
      - name: Verify source, markup and disposable Git examples
        run: python3 scripts/seo-growth-cycle/test_git_deployment_article.py
      - name: Verify checkout isolation and install locked dependencies
        working-directory: website
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e bootstrap/cache/config.php
          php -v
          git rev-parse HEAD
          composer install --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
          php artisan package:discover --ansi
      - name: PHP syntax and application regression tests
        working-directory: website
        run: |
          set -euo pipefail
          php -l tests/Feature/GitDeploymentArticleReviewTest.php
          vendor/bin/phpunit --filter='GitDeploymentArticleReviewTest|GrowthArticlePublishingTest|BlogSitemapLastmodTest' --display-warnings --fail-on-warning --colors=never
      - name: Record test scope
        if: always()
        run: |
          {
            echo '## Scope'
            echo 'This job uses an isolated checkout, synthetic SQLite data and no production credentials.'
            echo 'No production deployment, CMS update, Google login, provider order or host cron is performed.'
            echo 'Passing automated checks is not independent editorial review or production acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

  public-observation:
    if: github.repository == 'servernetir/server' && github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout checker without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Observe fifteen existing public pages without login or writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = ['/vps/hourly', '/gpu', '/blog/git-basics-for-deployment', '/blog/object-storage-vs-block-storage', '/blog/php-version-upgrade-guide']
          rows = []
          for path in paths:
              alternates = {'fa': path, 'en': '/en' + path, 'tr': '/tr' + path}
              for locale, prefix in [('fa', ''), ('en', '/en'), ('tr', '/tr')]:
                  rows.append({'path': prefix + path, 'language': locale, 'alternates': alternates})
          Path('/tmp/seo-public-targets.json').write_text(json.dumps({'schema_version': 1, 'targets': rows}))
          PY
          result=0
          python3 scripts/seo-growth-cycle/check_public.py --targets /tmp/seo-public-targets.json --output /tmp/seo-public-observation.json --timeout 15 --run-id "seo-git-${GITHUB_RUN_ID}" || result=$?
          test ! -f /tmp/seo-public-observation.json || cat /tmp/seo-public-observation.json
          exit "$result"
