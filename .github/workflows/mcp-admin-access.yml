name: MCP Proxmox administrator enrollment
on:
  pull_request:
    paths:
      - 'infra/proxmox/mcp_admin_access.py'
      - 'infra/proxmox/test_mcp_admin_access.py'
      - '.github/workflows/mcp-admin-access.yml'
  push:
    branches: [develop]
    paths:
      - 'infra/proxmox/mcp_admin_access.py'
      - 'infra/proxmox/test_mcp_admin_access.py'
      - '.github/workflows/mcp-admin-access.yml'
permissions:
  contents: read
jobs:
  enrollment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infra/proxmox -p test_mcp_admin_access.py -v
