name: Hermes Growth read client

on:
  pull_request:
    branches: [develop]
    paths:
      - 'infra/hermes/growth-client-20261101/**'
      - '.github/workflows/hermes-growth-read-client.yml'

permissions:
  contents: read

concurrency:
  group: hermes-growth-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Read-only HMAC contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up isolated PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - name: Validate the minimum-privilege client
        run: |
          set -euo pipefail
          php -l infra/hermes/growth-client-20261101/HermesGrowthReadClient.php
          php -l infra/hermes/growth-client-20261101/test.php
          php -l infra/hermes/growth-client-20261101/preflight.php
          php -l infra/hermes/growth-client-20261101/preflight-test.php
          php -l infra/hermes/growth-client-20261101/GrowthReadCycle.php
          php -l infra/hermes/growth-client-20261101/owner-growth-caller.php
          php -l infra/hermes/growth-client-20261101/cycle-test.php
          php infra/hermes/growth-client-20261101/test.php
          php infra/hermes/growth-client-20261101/preflight-test.php
          php infra/hermes/growth-client-20261101/cycle-test.php
      - name: Exercise the real no-secret filesystem probe
        run: |
          set -euo pipefail
          root="$PWD/infra/hermes/growth-client-20261101"
          client="$root/HermesGrowthReadClient.php"
          caller="$root/owner-growth-caller.php"
          php "$root/preflight.php" \
            --client="$client" \
            --expected-client-sha="$(sha256sum "$client" | cut -d' ' -f1)" \
            --caller="$caller" \
            --expected-caller-sha="$(sha256sum "$caller" | cut -d' ' -f1)" \
            --expected-uid="$(id -u)" \
            --peer-epoch="$(date +%s)" \
            --max-skew=60 > "$RUNNER_TEMP/hermes-growth-preflight.json"
          php -r '$result=json_decode(file_get_contents($argv[1]), true, 32, JSON_THROW_ON_ERROR); if (($result["status"] ?? null) !== "ready" || basename((string) ($result["observed"]["caller"]["path"] ?? "")) !== "owner-growth-caller.php") { exit(1); }' "$RUNNER_TEMP/hermes-growth-preflight.json"
      - name: Record acceptance boundary
        if: always()
        run: echo 'Synthetic HMAC contract, local no-secret readiness and receipt-bound caller only; no credential creation, live request, VM install, customer data, send, finance or scheduler change.' >> "$GITHUB_STEP_SUMMARY"
