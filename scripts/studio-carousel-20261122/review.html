<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServerNet · Carousel design review</title><style>body{margin:0;background:#e8edf3;color:#18344e;font:14px/1.6 sans-serif}header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:15px;border-bottom:1px solid #b5c6d7;background:#f9fbff}button{font:inherit;color:#214a68;background:#fff;border:1px solid #b4cada;border-radius:7px;padding:7px 12px;cursor:pointer;min-height:40px}button.active{color:#fff;background:#1679a5;border-color:#1679a5}.pane{width:1280px;max-width:none;margin:20px auto;background:#07101a;border:0;box-shadow:0 15px 40px #1a3b5a20}iframe{display:block;width:100%;height:1300px;border:0}p{text-align:center;margin:12px}nav{display:flex;gap:7px}</style></head><body><header><b dir="ltr">ServerNet · Design review</b><nav aria-label="عرض نمایش"><button data-width="1280" class="active">1280px</button><button data-width="390">390px</button><button data-width="320">320px</button></nav><nav aria-label="زبان"><button data-lang="fa" class="active">فارسی</button><button data-lang="en">English</button><button data-lang="tr">Türkçe</button></nav><button id="show-studio">نمایش Studio</button><button id="show-infrastructure">نمایش زیرساخت</button><button id="theme">روشن / تیره</button></header><div class="pane" id="pane"><iframe id="view" title="ServerNet responsive preview" src="preview-fa.html"></iframe></div><script>
(function(){var frame=document.getElementById('view'),locale='fa',theme='dark',live=new URLSearchParams(location.search).has('live');
function source(){return live?(locale==='fa'?'/':'/'+locale)+'?qa=studio-carousel-review':'preview-'+locale+'.html';}
document.querySelectorAll('[data-width]').forEach(function(b){b.onclick=function(){document.getElementById('pane').style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(function(x){x.classList.toggle('active',x===b);});};});
document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){locale=b.dataset.lang;frame.src=source();document.querySelectorAll('[data-lang]').forEach(function(x){x.classList.toggle('active',x===b);});};});
function choose(name){var button=frame.contentDocument.querySelector('[data-hero-target="'+name+'"]');if(button)button.click();}
document.getElementById('show-studio').onclick=function(){choose('studio');};document.getElementById('show-infrastructure').onclick=function(){choose('infrastructure');};
document.getElementById('theme').onclick=function(){theme=theme==='dark'?'light':'dark';frame.contentDocument.documentElement.dataset.theme=theme;};
frame.onload=function(){frame.contentDocument.documentElement.dataset.theme=theme;};if(live)frame.src=source();
}());</script></body></html>
