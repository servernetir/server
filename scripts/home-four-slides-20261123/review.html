<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>ServerNet four services · responsive review</title><style>body{margin:0;background:#172338;color:#d7e9fa;font:13px system-ui}header{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px;position:sticky;top:0;background:#172338;z-index:100}button,select{font:inherit;padding:7px 10px;background:#253c58;color:#e9f7ff;border:1px solid #54708b;border-radius:5px;cursor:pointer}#frame{width:1280px;height:720px;margin:0 auto 20px;background:#080d18}iframe{display:block;width:100%;height:100%;border:0}output{font-size:12px;color:#93cbdc}</style></head><body><header>
<button data-size="1280,720">1280 × 720</button><button data-size="1366,768">1366 × 768</button><button data-size="1920,1080">1920 × 1080</button><button data-size="1024,600">1024 × 600</button><button data-size="390,844">390 × 844</button><button data-size="320,740">320 × 740</button>
<select aria-label="Language" id="language"><option value="fa">فارسی</option><option value="en">English</option><option value="tr">Türkçe</option></select>
<button data-slide="infrastructure">Infrastructure</button><button data-slide="studio">Studio</button><button data-slide="n8n">n8n</button><button data-slide="hosting">Hosting</button><button id="theme">Light / dark</button><output id="measure"></output></header>
<div id="frame"><iframe title="Responsive ServerNet homepage" id="view" src="preview-fa.html"></iframe></div>
<script>
const frame=document.getElementById('frame'),view=document.getElementById('view'),locale=document.getElementById('language');let theme='dark';
const live=new URLSearchParams(location.search).has('live');
function source(){return live?(locale.value==='fa'?'/':'/'+locale.value)+'?qa=home-four-review':'preview-'+locale.value+'.html';}
function measure(){try{const d=view.contentDocument,e=d.documentElement,rail=d.querySelector('.sn-proof-rail');document.getElementById('measure').textContent=e.clientWidth+' × '+e.clientHeight+' · stats bottom '+Math.round(rail?.getBoundingClientRect().bottom||0)+' · overflow '+(e.scrollWidth-e.clientWidth);}catch{}}
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));};
for(const button of document.querySelectorAll('[data-slide]'))button.onclick=()=>{view.contentDocument.querySelector('[data-hero-target="'+button.dataset.slide+'"]').click();measure();};
locale.onchange=()=>view.src=source();document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';view.contentDocument.documentElement.dataset.theme=theme;measure();};view.onload=()=>{view.contentDocument.documentElement.dataset.theme=theme;measure();};view.src=source();
</script></body></html>
